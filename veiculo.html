<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo - Sistema Norteador</title>
</head>
<body>

    <header>
        <h1>Cadastro de Veículo</h1>
    </header>

    <main>
        <form action="#" method="POST">
            
            <div>
                <label for="marca">Marca do Veículo:</label><br>
                <input type="text" id="marca" name="marca" placeholder="Ex: Chevrolet, Fiat" required>
            </div>
            <br>

            <div>
                <label for="modelo">Modelo:</label><br>
                <input type="text" id="modelo" name="modelo" placeholder="Ex: Onix, Uno" required>
            </div>
            <br>

            <div>
                <label for="placa">Número da Placa:</label><br>
                <input type="text" id="placa" name="placa" placeholder="Ex: ABC1D23" required>
            </div>
            <br>

            <div>
                <button type="submit">Cadastrar Veículo</button>
            </div>

        </form>

        <p><a href="index.html">← Voltar para a página inicial</a></p>
    </main>

</body>
</html>
